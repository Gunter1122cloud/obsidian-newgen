# Build the NewGen site. Deploy only to an explicitly configured NewGen Pages project.
# Repository variable: NEWGEN_CLOUDFLARE_PROJECT
# Repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "website/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-newgen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install and build site
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: Upload verified website build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: newgen-website
          path: website/dist
          if-no-files-found: error

      - name: Validate deployment configuration
        id: config
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          PROJECT: ${{ vars.NEWGEN_CLOUDFLARE_PROJECT }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$PROJECT" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deployment is not configured for NewGen. The verified website artifact is available."
            exit 0
          fi
          if [[ ! "$PROJECT" =~ ^[a-z0-9][a-z0-9-]*$ ]] || [ "$PROJECT" = "getyark" ]; then
            echo "::error::Set NEWGEN_CLOUDFLARE_PROJECT to a separate NewGen Pages project."
            exit 1
          fi
          if [ -z "$API_TOKEN" ] || [ -z "$ACCOUNT_ID" ]; then
            echo "::error::Configured NewGen deployment requires both Cloudflare secrets."
            exit 1
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to configured NewGen Cloudflare Pages
        if: steps.config.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/dist --project-name=${{ vars.NEWGEN_CLOUDFLARE_PROJECT }}
