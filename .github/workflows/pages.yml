# Build and retain the website on GitHub Actions only. No external deploy.
name: GitHub Website Artifact

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "website/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-website-newgen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install and build site
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: Upload verified website build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: newgen-website
          path: website/dist
          if-no-files-found: error
