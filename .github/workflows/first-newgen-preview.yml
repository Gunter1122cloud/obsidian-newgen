name: Verified NewGen Windows preview

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: first-newgen-preview
  cancel-in-progress: false

jobs:
  release-preview:
    # Only a successful push CI on our main may queue the requested preview.
    if: >-
      github.repository == 'Gunter1122cloud/obsidian-newgen' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Queue verified 0.29.1 preview release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          TAG=v0.29.1
          MAIN=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          if [ "$VERIFIED_SHA" != "$MAIN" ]; then
            echo "Verified CI is no longer for current main; skip."
            exit 0
          fi
          VERSION=$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$VERIFIED_SHA" --jq .content | base64 -d | jq -r .version)
          if [ "v$VERSION" != "$TAG" ]; then
            echo "This release automation is only for $TAG; skip."
            exit 0
          fi
          RELEASE=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          if [ -n "$RELEASE" ]; then
            echo "Preview release already exists; skip."
            exit 0
          fi
          TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq ".[] | select(.ref == \"refs/tags/$TAG\") | .object.sha")
          if [ -z "$TAG_SHA" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$VERIFIED_SHA" --jq .ref
          elif [ "$TAG_SHA" != "$VERIFIED_SHA" ]; then
            echo "::error::Existing preview tag points at a different commit; never move it automatically."
            exit 1
          fi
          # GITHUB_TOKEN-created tags do not trigger push workflows. Explicitly
          # dispatch the existing release workflow, which rechecks main, CI,
          # tests, optional proxy configuration, packaged payload, manifest and SHA256 checksums.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f "tag=$TAG"
