<!DOCTYPE html>
<html lang="en" data-yark-splash="1">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline';"
    />
    <title>Obsidian Command NewGen</title>
    <style>
      :root {
        --bg: #17130e;
        --cyan: #e5c37d;
        --ink: #f4f7fb;
        --muted: #b4c2d8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: "Segoe UI", "Inter", system-ui, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }

      body {
        display: grid;
        place-items: center;
        background:
          repeating-linear-gradient(0deg, transparent 0 39px, rgba(229, 195, 125, 0.05) 39px 40px),
          repeating-linear-gradient(90deg, transparent 0 39px, rgba(229, 195, 125, 0.05) 39px 40px),
          radial-gradient(ellipse 70% 55% at 50% 28%, rgba(180, 133, 55, 0.22), transparent 62%),
          radial-gradient(ellipse 50% 40% at 50% 100%, rgba(32, 23, 12, 0.9), transparent 70%),
          var(--bg);
      }

      .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(100%, 460px);
        padding: 20px 24px 18px;
      }

      .mark {
        width: min(360px, 86vw);
        line-height: 0;
      }

      .mark svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .yark-glow-soft {
        animation: yark-glow-soft 2.6s ease-in-out infinite;
      }

      .yark-glow-core {
        animation: yark-glow-core 2.6s ease-in-out infinite;
      }

      @keyframes yark-glow-soft {
        0%,
        100% {
          opacity: 0.2;
        }
        50% {
          opacity: 0.85;
        }
      }

      @keyframes yark-glow-core {
        0%,
        100% {
          opacity: 0.28;
        }
        50% {
          opacity: 1;
        }
      }

      .stage {
        position: relative;
        isolation: isolate;
      }

      .stage::before {
        content: "";
        position: absolute;
        z-index: -1;
        width: 340px;
        height: 340px;
        top: 2px;
        left: 50%;
        margin-left: -170px;
        border: 1px dashed rgba(229, 195, 125, 0.27);
        border-radius: 50%;
        animation: tactical-orbit 28s linear infinite;
      }

      .mark {
        animation: tactical-arrival 700ms ease-out both;
      }

      .loading-track {
        width: min(240px, 72vw);
        height: 3px;
        margin-top: 18px;
        overflow: hidden;
        background: rgba(229, 195, 125, 0.16);
      }

      .loading-track::after {
        display: block;
        width: 36%;
        height: 100%;
        content: "";
        background: linear-gradient(90deg, transparent, var(--cyan), transparent);
        animation: tactical-sweep 1.7s ease-in-out infinite;
      }

      @keyframes tactical-orbit {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes tactical-arrival {
        from {
          opacity: 0;
          transform: scale(0.94);
        }

        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes tactical-sweep {
        from {
          transform: translateX(-100%);
        }

        to {
          transform: translateX(380%);
        }
      }

      .meta {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.08em;
        min-height: 1em;
      }

      .status {
        display: flex;
        align-items: baseline;
        margin: 4px 0 0;
        color: var(--cyan);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.12em;
      }

      .dot {
        opacity: 0.25;
        animation: dot-blink 1.2s ease-in-out infinite;
      }

      .dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .dot:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes dot-blink {
        0%,
        80%,
        100% {
          opacity: 0.2;
        }
        40% {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .stage::before,
        .mark,
        .loading-track::after {
          animation: none !important;
        }

        .loading-track::after {
          width: 100%;
          opacity: 0.45;
        }

        .dot {
          animation: none !important;
          opacity: 1 !important;
        }

        .yark-glow-soft,
        .yark-glow-core {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="Obsidian Command NewGen is starting">
      <div class="mark">__YARK_SPLASH_SVG__</div>
      <p class="meta" id="version">__YARK_VERSION__</p>
      <p class="status" aria-live="polite">
        Starting<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
      </p>
      <div class="loading-track" aria-hidden="true"></div>
    </main>
  </body>
</html>
